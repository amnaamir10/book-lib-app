name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # 1) Run automated tests first; if they fail, nothing is built or deployed
  test:
    name: Test backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests
        working-directory: backend
        run: npm test

  # 2) Build both Docker images and push them to GitHub Container Registry
  build-push:
    name: Build and push images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short commit ID
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app tier image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          provenance: false
          tags: |
            ghcr.io/amnaamir10/cea-app:latest
            ghcr.io/amnaamir10/cea-app:${{ env.SHORT_SHA }}

      - name: Build and push web tier image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          provenance: false
          tags: |
            ghcr.io/amnaamir10/cea-web:latest
            ghcr.io/amnaamir10/cea-web:${{ env.SHORT_SHA }}

  # 3) Deploy: rolling update of the running containers on AWS via SSM Run Command (no SSH)
  deploy:
    name: Deploy to AWS
    needs: build-push
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      INTERNAL_ALB: internal-cea-alb-internal-526795828.us-east-1.elb.amazonaws.com
      PUBLIC_ALB: cea-alb-public-546330623.us-east-1.elb.amazonaws.com
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Write update scripts
        run: |
          cat > common.sh <<'EOF'
          set -e
          REGION=us-east-1
          get() { aws ssm get-parameter --region $REGION --name "$1" --with-decryption --query Parameter.Value --output text; }
          get /cea/ghcr-token | docker login ghcr.io -u "$(get /cea/ghcr-user)" --password-stdin
          EOF

          { cat common.sh; cat <<'EOF'
          docker pull ghcr.io/amnaamir10/cea-app:latest
          docker rm -f app || true
          docker run -d --name app --restart unless-stopped -p 3200:3200 \
            --log-driver awslogs --log-opt awslogs-region=$REGION \
            --log-opt awslogs-group=/cea/app --log-opt awslogs-create-group=true \
            -e DB_HOST="$(get /cea/db-host)" -e DB_USER="$(get /cea/db-user)" \
            -e DB_PASSWORD="$(get /cea/db-password)" -e DB_NAME=react_node_app \
            ghcr.io/amnaamir10/cea-app:latest
          docker image prune -f
          EOF
          } > app.sh

          { cat common.sh; cat <<EOF
          docker pull ghcr.io/amnaamir10/cea-web:latest
          docker rm -f web || true
          docker run -d --name web --restart unless-stopped -p 80:80 \
            --log-driver awslogs --log-opt awslogs-region=us-east-1 \
            --log-opt awslogs-group=/cea/web --log-opt awslogs-create-group=true \
            -e API_UPSTREAM=${INTERNAL_ALB}:80 -e DNS_RESOLVER=10.0.0.2 \
            ghcr.io/amnaamir10/cea-web:latest
          docker image prune -f
          EOF
          } > web.sh

      - name: Deploy app tier, then web tier (one instance at a time)
        run: |
          deploy() {
            TIER=$1; SCRIPT=$2
            jq -Rs '{commands: [.]}' "$SCRIPT" > params.json
            CID=$(aws ssm send-command \
              --document-name AWS-RunShellScript \
              --targets "Key=tag:Tier,Values=$TIER" \
              --max-concurrency 1 --max-errors 0 \
              --comment "Deploy $TIER ${GITHUB_SHA::7}" \
              --parameters file://params.json \
              --query Command.CommandId --output text)
            echo "Deploying $TIER, command $CID"
            for i in $(seq 1 60); do
              STATUS=$(aws ssm list-commands --command-id "$CID" --query 'Commands[0].Status' --output text)
              echo "  $TIER: $STATUS"
              case "$STATUS" in
                Success) return 0 ;;
                Failed|Cancelled|TimedOut|Cancelling)
                  aws ssm list-command-invocations --command-id "$CID" --details \
                    --query 'CommandInvocations[].CommandPlugins[].Output' --output text
                  exit 1 ;;
              esac
              sleep 10
            done
            echo "Timed out waiting for $TIER"; exit 1
          }
          deploy app app.sh
          deploy web web.sh

      - name: Smoke test through the public load balancer
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "http://${PUBLIC_ALB}/api/health"; then echo; echo "Deployment healthy"; exit 0; fi
            sleep 10
          done
          echo "Health check failed"; exit 1